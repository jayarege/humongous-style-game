<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Casebound</title>
        <style>
            html,
            body {
                margin: 0;
                height: 100%;
                background: #1b1530;
                color: #fff4d6;
                font: 15px system-ui, sans-serif;
            }
            header {
                display: flex;
                align-items: center;
                gap: 16px;
                padding: 8px 16px;
                height: 40px;
                box-sizing: border-box;
            }
            h1 {
                font-size: 17px;
                margin: 0;
            }
            #status {
                opacity: 0.8;
            }
            button {
                margin-left: auto;
                padding: 6px 14px;
                cursor: pointer;
                border-radius: 6px;
                border: 0;
                background: #ffd23f;
                color: #1b1530;
                font-weight: 600;
            }
            #game {
                height: calc(100dvh - 40px);
            }
            canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>Casebound</h1>
            <span id="status" role="status" aria-live="polite">Click things to talk and choose. Progress saves in this browser.</span>
            <button id="restart">Start over</button>
        </header>
        <main id="game" aria-label="Point-and-click adventure"></main>
        <script type="module" src="./src/main.ts"></script>
    </body>
</html>
