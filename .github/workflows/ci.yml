name: CI/CD

# Every push and pull request: unit + content tests, typecheck, build, size budget, then a full
# browser playthrough. Pushes to main that pass everything are published to GitHub Pages.
# Changes that only touch docs/ or Markdown files skip the pipeline (use "Run workflow" to force it).
#
# One-time setup for publishing: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
# Until then the deploy job fails with that instruction, so the red X tells you what to do.

on:
    push:
        branches: [main]
        paths-ignore: ["docs/**", "**/*.md"]
    pull_request:
        paths-ignore: ["docs/**", "**/*.md"]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    # A newer push to the same pull request cancels the older run. Runs on main always finish.
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Test and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Unit and content tests
              run: npm test
            - name: Typecheck and build
              run: npm run build
            - name: Size budget
              run: npm run check:size
            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: dist
                  # Long enough to re-run an older deploy as a rollback.
                  retention-days: 30
                  if-no-files-found: error

    e2e:
        name: Browser playthrough
        needs: check
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-node@v7
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - name: Install Chromium
              run: npx playwright install --with-deps chromium
            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist
            - name: Smoke test and full playthrough
              env:
                  # Seeded random answers: a failure prints this seed so the exact run can be replayed.
                  E2E_SEED: ${{ github.run_id }}
              run: npm run e2e
            - name: Keep screenshots and the auto log
              if: always()
              uses: actions/upload-artifact@v7
              with:
                  name: e2e-output
                  path: e2e-output
                  retention-days: 7
                  if-no-files-found: ignore

    deploy:
        name: Publish to GitHub Pages
        needs: [check, e2e]
        # Pushes to main and the manual "Run workflow" button on main. Never pull requests.
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: pages
            cancel-in-progress: false
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Check that Pages is set to GitHub Actions
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  # gh prints the error body on a 404, so go by its exit status, not its output.
                  if out=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null); then build_type=$out; else build_type=off; fi
                  if [ "$build_type" != "workflow" ]; then
                    if [ "$build_type" = "off" ]; then why="GitHub Pages is not turned on"; else why="GitHub Pages is set to \"$build_type\" (deploy from a branch)"; fi
                    msg="$why, so nothing was published. Fix: repo Settings -> Pages -> Build and deployment -> Source: GitHub Actions. Then open this run and click Re-run all jobs."
                    echo "::error::$msg"
                    printf '### Not published\n\n%s\n' "$msg" >> "$GITHUB_STEP_SUMMARY"
                    exit 1
                  fi
            - uses: actions/download-artifact@v8
              with:
                  name: dist
                  path: dist
            - uses: actions/upload-pages-artifact@v5
              with:
                  path: dist
            - id: deployment
              uses: actions/deploy-pages@v5
            - run: printf '### Published\n\n%s\n' "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
